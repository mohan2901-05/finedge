<div class="page-head">
  <h1>{{ isEdit ? 'Edit account' : 'New account' }}</h1>
  <a class="btn btn-ghost" routerLink="/accounts">← Back</a>
</div>

@if (error()) { <div class="alert alert-error" role="alert">{{ error() }}</div> }

<form class="card form-grid" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <label for="customerId">Customer ID</label>
    <input id="customerId" type="number" formControlName="customerId" min="1" />
    @if (invalid('customerId')) { <span class="field-error">Customer ID is required.</span> }
  </div>
  <div class="field">
    <label for="accountType">Account type</label>
    <select id="accountType" formControlName="accountType">
      <option value="">Select type…</option>
      @for (t of types; track t) { <option [value]="t">{{ t }}</option> }
    </select>
    @if (invalid('accountType')) { <span class="field-error">Account type is required.</span> }
  </div>
  @if (!isEdit) {
    <div class="field">
      <label for="initialBalance">Initial balance</label>
      <input id="initialBalance" type="number" formControlName="initialBalance" min="0" step="0.01" />
      @if (invalid('initialBalance')) { <span class="field-error">Balance cannot be negative.</span> }
    </div>
    <div class="field">
      <label for="currency">Currency</label>
      <input id="currency" formControlName="currency" maxlength="10" />
    </div>
  }
  <div class="field">
    <label for="status">Status</label>
    <select id="status" formControlName="status">
      @for (s of statuses; track s) { <option [value]="s">{{ s }}</option> }
    </select>
  </div>
  <div class="form-actions full">
    <a class="btn btn-ghost" routerLink="/accounts">Cancel</a>
    <button class="btn btn-primary" type="submit" [disabled]="loading()">{{ isEdit ? 'Save changes' : 'Create account' }}</button>
  </div>
</form>

<div class="page-head">
  <h1>New transaction</h1>
  <a class="btn btn-ghost" routerLink="/transactions">← Back</a>
</div>

@if (error()) { <div class="alert alert-error" role="alert">{{ error() }}</div> }

<form class="card form-grid" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <label for="accountId">Account ID</label>
    <input id="accountId" type="number" formControlName="accountId" min="1" />
    @if (invalid('accountId')) { <span class="field-error">Account ID is required.</span> }
  </div>
  <div class="field">
    <label for="transactionType">Type</label>
    <select id="transactionType" formControlName="transactionType">
      <option value="">Select type…</option>
      @for (t of types; track t) { <option [value]="t">{{ t }}</option> }
    </select>
    @if (invalid('transactionType')) { <span class="field-error">Type is required.</span> }
  </div>
  <div class="field">
    <label for="amount">Amount (USD)</label>
    <input id="amount" type="number" formControlName="amount" min="0.01" step="0.01" />
    @if (invalid('amount')) { <span class="field-error">Amount must be at least 0.01.</span> }
  </div>
  <div class="field">
    <label for="description">Description</label>
    <input id="description" formControlName="description" maxlength="255" placeholder="e.g. Monthly salary deposit" />
    @if (invalid('description')) { <span class="field-error">Description is required.</span> }
  </div>
  <div class="form-actions full">
    <a class="btn btn-ghost" routerLink="/transactions">Cancel</a>
    <button class="btn btn-primary" type="submit" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Create transaction' }}</button>
  </div>
</form>

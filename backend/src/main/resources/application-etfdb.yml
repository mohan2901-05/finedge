# ========================================================================
# ETFDB local profile (spring.profiles.active=etfdb)
# Dedicated database: etfdb_local (NEVER finedgedb / shared / prod).
# No secrets committed: use DB_* env vars; defaults are local-only.
# Flyway chain is canonical: classpath:db/migration (legacy V1/V2 removed in M2).
# MySQL is primary for schema fidelity. H2 is NOT configured here.
# Run: .\mvnw.cmd spring-boot:run  (mvnw.cmd activates this profile
# automatically; no per-session env setup needed beyond the one-time
# DB_PASSWORD below)
# ========================================================================
spring:
  config:
    activate:
      on-profile: etfdb

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:etfdb_local}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&tinyInt1isBit=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:etfdb_app}
    # No default password on purpose: a missing DB_PASSWORD must fail fast at
    # startup ("Could not resolve placeholder 'DB_PASSWORD'") instead of
    # connecting with a guessed credential. Set it once per machine, never
    # commit it (see M2 report one-time setup: setx DB_PASSWORD "...").
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Local development only: bind loopback so the unauthenticated dev API is
# never exposed beyond this machine.
server:
  address: 127.0.0.1
  port: 8080

finedge:
  cors:
    allowed-origins: "http://localhost:4200,http://127.0.0.1:4200"

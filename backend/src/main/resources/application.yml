spring:
  application:
    name: finedge-backend
  profiles:
    active: default

  datasource:
    url: jdbc:h2:mem:finedgedb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /

finedge:
  cors:
    allowed-origins: "http://localhost:4200,http://127.0.0.1:4200"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

logging:
  level:
    root: INFO
    com.finedge: DEBUG
    org.hibernate.SQL: WARN
    # The AWS serverless container logs the full process environment at INFO
    # (including secrets such as DB_PASSWORD when set). Keep it at WARN.
    com.amazonaws.serverless.proxy.spring: WARN

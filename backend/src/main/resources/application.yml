spring:
  application:
    name: finedge-backend
  profiles:
    active: default

  datasource:
    url: jdbc:h2:mem:finedgedb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /

finedge:
  cors:
    allowed-origins: "http://localhost:4200,http://127.0.0.1:4200"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

  # Authentication (Phase 1). Registration assigns only the configured default
  # borrower role/organisation; client-supplied role/org is never trusted.
  auth:
    # Default organisation and borrower role assigned to self-registered users.
    # Must reference existing org_info.pk_org_id / role_master.pk_role_id.
    # Defaults to seeded records ORG-T001 and ROLE-T04 for zero-setup / dev mode.
    default-org-id: ${FINEDGE_AUTH_DEFAULT_ORG_ID:ORG-T001}
    default-borrower-role-id: ${FINEDGE_AUTH_DEFAULT_BORROWER_ROLE_ID:ROLE-T04}

  # JWT access token configuration.
  jwt:
    # Signing key (Base64-encoded, >= 256 bits). NEVER commit a production key.
    # The value below is a DEVELOPMENT-ONLY placeholder. Production MUST set
    # FINEDGE_JWT_SECRET to a strong, random Base64 key via environment.
    secret: ${FINEDGE_JWT_SECRET:ZGV2LXBsYWNlY2hvbGQta2V5LXdoaWNoLXNob3VsZC1iZS1yZXBsYWNlZC1pbi1wcm9kdWN0}
    expiration-ms: ${FINEDGE_JWT_EXPIRATION_MS:900000}
    issuer: ${FINEDGE_JWT_ISSUER:finedge}

logging:
  level:
    root: INFO
    com.finedge: DEBUG
    org.hibernate.SQL: WARN
    # The AWS serverless container logs the full process environment at INFO
    # (including secrets such as DB_PASSWORD when set). Keep it at WARN.
    com.amazonaws.serverless.proxy.spring: WARN

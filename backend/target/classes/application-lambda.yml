# ========================================================================
# FinEdge - Lambda Profile (spring.profiles.active=lambda)
# Used when running on AWS Lambda + API Gateway
# ========================================================================
spring:
  config:
    activate:
      on-profile: lambda

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:finedgedb}?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 120000
      connection-timeout: 10000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Lambda has its own logging (CloudWatch)
logging:
  level:
    root: INFO
    com.finedge: INFO
    org.hibernate.SQL: WARN
